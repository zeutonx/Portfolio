	<g fill="none" transform="rotate(-32 682 200)"><ellipse cx="682" cy="200" rx="86" ry="34" fill="#ffffff" stroke="#17191c" stroke-width="2"/><path d="M682 200L763 200" stroke="#1f4e9c" stroke-width="2.5" marker-end="url(#acc)"/><path d="M682 200L682 171" stroke="#17191c" stroke-width="2.5" marker-end="url(#ink)"/></g>
